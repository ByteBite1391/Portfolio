<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>404 — Page Not Found | AmirAli Pourbabaeii</title>
    <meta name="description" content="The page you are looking for could not be found.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Portfolio/css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }
        .error-code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 800;
            background: linear-gradient(135deg, #d4af37, #a88225);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 1rem;
            font-family: 'Fira Code', monospace;
        }
        .error-title {
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--text-heading, #f9fafb);
            margin-bottom: 1rem;
            font-weight: 700;
        }
        .error-desc {
            color: var(--text-secondary, #9ca3af);
            margin-bottom: 2rem;
            max-width: 30rem;
            margin-inline: auto;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">The page you are looking for doesn't exist or has been moved. Let's get you back on track.</p>
            <a href="/" class="btn-primary" style="display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;border-radius:12px;background:linear-gradient(135deg,#d4af37,#a88225);color:#08080a;font-weight:600;text-decoration:none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
                </svg>
                Back to Home
            </a>
        </div>
    </main>
</body>
</html>
